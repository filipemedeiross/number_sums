[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name        = "sumplete"
version     = "0.1.0"
description = "Generator and solver for the Number Sums game."

requires-python = ">=3.10"
readme          = "README.md"
license         = { text = "MIT" }

authors     = [
    { name = "Filipe de Medeiros" },
]
classifiers = [
    "Programming Language :: Python :: 3"   ,
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
ui = [
    "pygame>=2.5,<3",
]
dev = [
    "jupyterlab>=4" ,
    "pygame>=2.5,<3",
    "pytest>=8"     ,
]

[project.scripts]
sumplete-game = "number_sums.pygame_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"  ]